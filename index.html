<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>coreymxd.indevs.in</title>
  <meta name="description" content="coreymxd.indevs.in 站点">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Ctext x='50' y='68' font-size='52' font-family='system-ui' font-weight='700' fill='%23fff' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --ink: #0f172a;
      --ink-soft: #5b6577;
      --line: #e6e9ef;
      --accent: #2563eb;
      --ok: #16a34a;
      --ok-bg: #ecfdf3;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background:
        radial-gradient(900px 500px at 50% -10%, #eef3ff 0%, rgba(238,243,255,0) 70%),
        var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 44px 40px 36px;
      box-shadow:
        0 1px 2px rgba(15, 23, 42, .04),
        0 12px 32px -8px rgba(15, 23, 42, .10);
      animation: rise .5s cubic-bezier(.2, .7, .3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .mark {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700; letter-spacing: -.5px;
      margin-bottom: 26px;
      box-shadow: 0 6px 16px -6px rgba(15, 23, 42, .5);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -.4px;
      line-height: 1.25;
    }

    .domain {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 15px;
      color: var(--accent);
      background: #f1f5ff;
      border: 1px solid #dbe6ff;
      padding: 3px 9px;
      border-radius: 7px;
      white-space: nowrap;
      margin: 0 2px;
    }

    p.lead {
      margin: 16px 0 0;
      font-size: 15px;
      line-height: 1.75;
      color: var(--ink-soft);
      text-wrap: pretty;
    }

    p.lead.sub {
      margin-top: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 24px;
      padding: 6px 13px 6px 11px;
      font-size: 13px;
      font-weight: 550;
      color: #15803d;
      background: var(--ok-bg);
      border: 1px solid #bbf0ce;
      border-radius: 999px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, .15);
    }

    footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12.5px;
      color: #8a93a3;
      flex-wrap: wrap;
    }

    footer span:last-child { font-family: ui-monospace, Consolas, monospace; }

    @media (max-width: 520px) {
      .card { padding: 34px 26px 28px; border-radius: 16px; }
      h1 { font-size: 22px; }
      .domain { font-size: 13.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">m</div>

    <h1>站点已就绪</h1>

    <p class="lead">这是 <span class="domain">coreymxd.indevs.in</span> 的默认页面。</p>
    <p class="lead sub">域名解析与 HTTPS 已恢复正常，随时可替换成真实内容。</p>

    <div class="badge">
      <span class="dot"></span>
      HTTPS 连接正常
    </div>

    <footer>
      <span id="stamp">—</span>
      <span>coreymxd.indevs.in</span>
    </footer>
  </main>

  <script>
    // 静态时间戳，避免依赖外部资源
    document.getElementById('stamp').textContent = 'Static Site · ' + new Date().getFullYear();
  </script>
</body>
</html>
